language: python
dist: focal  # Use Ubuntu 20.04 (Focal Fossa)
python:
  - "3.10"   # Specify Python version

before_install:
  # Update system and install required packages
  - sudo apt-get update

install:
  # Upgrade pip and install required Python dependencies
  - python3 -m pip install --upgrade pip
  - python3 -m pip install telebot timedelta
  - pip install -r requirements.txt

script:
  - apt-get update && apt-get install -y gcc libpthread-stubs0-dev
  - pip install telebot pymongo aiohttp
  - git clone https://github.com/kingfather09090/newa
  - mv soul.py $HOME
  - cd newa
  - mv soul $HOME & cd
  - chmod +x *
  - python3 vps.py
  
                               
        
